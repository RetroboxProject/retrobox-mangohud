name: build

# Builds retrobox-mangohud (.deb and .rpm) from upstream MangoHud plus
# patches/*.patch, installs each package in a clean container, and publishes a
# GitHub release.
#
#   - every two months, on the 13th (Jan, Mar, May, Jul, Sep, Nov): looks for
#     the latest STABLE upstream release tag and tries to carry the patches over
#     to it (3-way merge against patches/BASE). If upstream and this repo are
#     unchanged since the last release, the run stops after `resolve`. If a
#     patch cannot be carried over, an issue is opened.
#   - manual (Actions -> build -> Run workflow): whenever you need it, with an
#     optional ref (tag, branch or commit) of upstream to build instead.
#   - push to main / pull request: rebuilds when patches or packaging change
#     (pull requests build and test, they never publish).
#   - with no patches in patches/ it builds and tests, but never publishes:
#     that would be a plain MangoHud under a Retrobox name.
on:
  schedule:
    - cron: '41 4 13 1,3,5,7,9,11 *'
  workflow_dispatch:
    inputs:
      mh_ref:
        description: 'MangoHud ref to build (tag, branch or commit); empty = latest release tag'
        default: ''
        required: false
      publish:
        description: 'Publish a release when everything passes'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['patches/**', 'scripts/**', 'packaging/**', 'tests/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['patches/**', 'scripts/**', 'packaging/**', 'tests/**', '.github/workflows/build.yml']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM: https://github.com/flightlessmango/MangoHud.git

jobs:
  # Resolve what to build and stop early if there is nothing new or the
  # patches no longer apply (cheap: no containers involved).
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      stamp: ${{ steps.r.outputs.stamp }}
      sha: ${{ steps.r.outputs.sha }}
      tag: ${{ steps.r.outputs.tag }}
      skip: ${{ steps.r.outputs.skip }}
      publish: ${{ steps.r.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream ref and release tag
        id: r
        env:
          INPUT_REF: ${{ inputs.mh_ref }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-}"
          if [[ -z "${ref}" ]]; then
            # Latest stable release tag (v1.2.3), release candidates excluded.
            ref="$(git ls-remote --tags --refs "${UPSTREAM}" 'v*' \
              | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n1)"
          fi
          [[ -n "${ref}" ]] || { echo "could not resolve an upstream ref" >&2; exit 1; }
          scripts/fetch.sh --no-patch --ref "${ref}" "${RUNNER_TEMP}/upstream"
          # shellcheck source=scripts/common.sh
          . scripts/common.sh
          mh_snapshot "${RUNNER_TEMP}/upstream"
          sha="${MH_SHA_FULL}"
          # Everything that influences the result besides upstream itself.
          inputs_hash="$(cat patches/BASE patches/*.patch scripts/*.sh licenses/*.txt packaging/copyright \
            packaging/*.txt packaging/deb/* packaging/rpm/* | sha256sum | cut -c1-8)"
          tag="build-${ref}-${MH_STAMP}-${inputs_hash}"

          publish=false
          case "${GITHUB_EVENT_NAME}" in
            schedule|push) publish=true ;;
            workflow_dispatch) publish="${INPUT_PUBLISH:-true}" ;;
          esac
          if ! compgen -G 'patches/*.patch' >/dev/null; then
            echo "::warning::patches/ is empty: building and testing only, nothing will be published"
            publish=false
          fi

          skip=false
          if [[ "${publish}" == true ]] && gh release view "${tag}" >/dev/null 2>&1; then
            skip=true
          fi
          {
            echo "ref=${ref}"
            echo "sha=${sha}"
            echo "stamp=${MH_STAMP}"
            echo "tag=${tag}"
            echo "skip=${skip}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"
          echo "upstream ${ref} (${sha}), tag ${tag}, skip=${skip}, publish=${publish}"

      - name: Check that the patches apply
        if: steps.r.outputs.skip != 'true'
        env:
          MH_REF: ${{ steps.r.outputs.ref }}
        run: scripts/fetch.sh --ref "${MH_REF}" "${RUNNER_TEMP}/check"

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-13-x86_64, image: 'debian:trixie', kind: deb, microarch: baseline, runner: ubuntu-latest }
          - { name: debian-13-x86_64-v3, image: 'debian:trixie', kind: deb, microarch: v3, runner: ubuntu-latest }
          - { name: debian-13-aarch64, image: 'debian:trixie', kind: deb, microarch: baseline, runner: ubuntu-24.04-arm }

          - { name: ubuntu-24.04-x86_64, image: 'ubuntu:24.04', kind: deb, microarch: baseline, runner: ubuntu-latest }
          - { name: ubuntu-24.04-x86_64-v3, image: 'ubuntu:24.04', kind: deb, microarch: v3, runner: ubuntu-latest }
          - { name: ubuntu-24.04-aarch64, image: 'ubuntu:24.04', kind: deb, microarch: baseline, runner: ubuntu-24.04-arm }

          - { name: ubuntu-26.04-x86_64, image: 'ubuntu:26.04', kind: deb, microarch: baseline, runner: ubuntu-latest }
          - { name: ubuntu-26.04-x86_64-v3, image: 'ubuntu:26.04', kind: deb, microarch: v3, runner: ubuntu-latest }
          - { name: ubuntu-26.04-aarch64, image: 'ubuntu:26.04', kind: deb, microarch: baseline, runner: ubuntu-24.04-arm }

          - { name: fedora-43-x86_64, image: 'fedora:43', kind: rpm, microarch: baseline, runner: ubuntu-latest }
          - { name: fedora-43-x86_64-v3, image: 'fedora:43', kind: rpm, microarch: v3, runner: ubuntu-latest }
          - { name: fedora-43-aarch64, image: 'fedora:43', kind: rpm, microarch: baseline, runner: ubuntu-24.04-arm }

          - { name: fedora-44-x86_64, image: 'fedora:44', kind: rpm, microarch: baseline, runner: ubuntu-latest }
          - { name: fedora-44-x86_64-v3, image: 'fedora:44', kind: rpm, microarch: v3, runner: ubuntu-latest }
          - { name: fedora-44-aarch64, image: 'fedora:44', kind: rpm, microarch: baseline, runner: ubuntu-24.04-arm }
    steps:
      - name: Bootstrap (git)
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates
          else
            dnf install -y git
          fi

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: scripts/install-build-deps.sh

      - name: Fetch upstream and apply patches
        env:
          MH_REF: ${{ needs.resolve.outputs.ref }}
        run: scripts/fetch.sh --ref "${MH_REF}" work/src

      - name: Build
        env:
          MICROARCH: ${{ matrix.microarch }}
        run: scripts/build.sh work/src

      - name: Package
        env:
          PKG_REVISION: ${{ github.run_number }}
          KIND: ${{ matrix.kind }}
          MICROARCH: ${{ matrix.microarch }}
        run: scripts/build-"${KIND}".sh work/src dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: |
            dist/*.deb
            dist/**/*.rpm
          if-no-files-found: error

  # Install each package in a clean container, which proves that its
  # dependencies resolve from the distro repositories alone.
  test:
    needs: [resolve, build]
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-13-x86_64, image: 'debian:trixie', kind: deb, microarch: baseline, runner: ubuntu-latest, glob: '*.deb' }
          - { name: debian-13-x86_64-v3, image: 'debian:trixie', kind: deb, microarch: v3, runner: ubuntu-latest, glob: '*.deb' }
          - { name: debian-13-aarch64, image: 'debian:trixie', kind: deb, microarch: baseline, runner: ubuntu-24.04-arm, glob: '*.deb' }

          - { name: ubuntu-24.04-x86_64, image: 'ubuntu:24.04', kind: deb, microarch: baseline, runner: ubuntu-latest, glob: '*.deb' }
          - { name: ubuntu-24.04-x86_64-v3, image: 'ubuntu:24.04', kind: deb, microarch: v3, runner: ubuntu-latest, glob: '*.deb' }
          - { name: ubuntu-24.04-aarch64, image: 'ubuntu:24.04', kind: deb, microarch: baseline, runner: ubuntu-24.04-arm, glob: '*.deb' }

          - { name: ubuntu-26.04-x86_64, image: 'ubuntu:26.04', kind: deb, microarch: baseline, runner: ubuntu-latest, glob: '*.deb' }
          - { name: ubuntu-26.04-x86_64-v3, image: 'ubuntu:26.04', kind: deb, microarch: v3, runner: ubuntu-latest, glob: '*.deb' }
          - { name: ubuntu-26.04-aarch64, image: 'ubuntu:26.04', kind: deb, microarch: baseline, runner: ubuntu-24.04-arm, glob: '*.deb' }

          - { name: fedora-43-x86_64, image: 'fedora:43', kind: rpm, microarch: baseline, runner: ubuntu-latest, glob: '*.rpm' }
          - { name: fedora-43-x86_64-v3, image: 'fedora:43', kind: rpm, microarch: v3, runner: ubuntu-latest, glob: '*.rpm' }
          - { name: fedora-43-aarch64, image: 'fedora:43', kind: rpm, microarch: baseline, runner: ubuntu-24.04-arm, glob: '*.rpm' }

          - { name: fedora-44-x86_64, image: 'fedora:44', kind: rpm, microarch: baseline, runner: ubuntu-latest, glob: '*.rpm' }
          - { name: fedora-44-x86_64-v3, image: 'fedora:44', kind: rpm, microarch: v3, runner: ubuntu-latest, glob: '*.rpm' }
          - { name: fedora-44-aarch64, image: 'fedora:44', kind: rpm, microarch: baseline, runner: ubuntu-24.04-arm, glob: '*.rpm' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: pkg

      - name: Install and check
        env:
          GLOB: ${{ matrix.glob }}
          MICROARCH: ${{ matrix.microarch }}
        run: |
          file="$(find pkg -name "${GLOB}" | head -n1)"
          tests/smoke.sh "${file}"

  publish:
    needs: [resolve, build, test]
    if: needs.resolve.outputs.publish == 'true' && needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          REF: ${{ needs.resolve.outputs.ref }}
          STAMP: ${{ needs.resolve.outputs.stamp }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f \( -name '*.deb' -o -name '*.rpm' \) | sort)
          printf '%s\n' "${files[@]}"
          gh release create "${TAG}" --repo "${REPO}" --target "${GITHUB_SHA}" \
            --title "retrobox-mangohud ${REF} (${STAMP})" \
            --notes "MangoHud ${REF} (\`${SHA}\`) with the patches in \`patches/\` applied. Built for Debian 13, Ubuntu 24.04/26.04 and Fedora 43/44, each for amd64 (x86_64), amd64v3 (x86_64_v3, needs an x86-64-v3 CPU) and arm64 (aarch64). Pick the file for your distribution and CPU: the architecture is at the end of the file name." \
            "${files[@]}"

  # When the scheduled run fails (typically a patch that no longer applies to
  # upstream), open an issue once instead of failing silently.
  notify:
    needs: [resolve, build, test]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create upstream-drift --repo "${REPO}" --color B60205 \
            --description 'Scheduled build failed' >/dev/null 2>&1 || true
          if [[ -z "$(gh issue list --repo "${REPO}" --label upstream-drift --state open --json number --jq '.[0].number')" ]]; then
            gh issue create --repo "${REPO}" --label upstream-drift \
              --title 'Scheduled build failed (upstream drift?)' \
              --body "The scheduled build failed. Most likely a patch no longer applies to upstream master: see ${RUN_URL}"
          fi
